# DentAssist Pro — web/PWA on Netlify
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build:web"
  publish = "dist-web"

[build.environment]
  NODE_VERSION = "20"

# sql.js needs correct WASM MIME type
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
